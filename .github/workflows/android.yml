name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Vosk English voice model
        run: |
          mkdir -p app/src/main/assets/model-en-us
          curl -L --fail --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -o /tmp/vosk-model.zip
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model
          cp -R /tmp/vosk-model/vosk-model-small-en-us-0.15/. \
            app/src/main/assets/model-en-us/
          rm -rf /tmp/vosk-model /tmp/vosk-model.zip

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-8-debug-APK
          path: app/build/outputs/apk/debug/*.apk
